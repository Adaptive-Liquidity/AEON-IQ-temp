# AEON IQ Temp Workflow Feature Development With Db Migration

## Action

Follow the feature-development-with-db-migration workflow:
1. Create or modify a SQL migration file in migrations/ to update the database schema.
2. Add or update Rust module files under src/ (e.g., src/credentials/...) to implement the feature logic.
3. Update Cargo.toml and Cargo.lock if new dependencies are needed.
4. Write or update tests in src/credentials/db_tests.rs or similar test files.
5. Integrate feature into main application logic (e.g., src/main.rs).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: migrations/*.sql, src/credentials/*.rs, src/main.rs

