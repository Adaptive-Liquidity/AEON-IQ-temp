# AEON IQ Temp Workflow Harden Schema Contract And Verification

## Action

Follow the harden-schema-contract-and-verification workflow:
1. Identify weaknesses or bypasses in current schema validation logic.
2. Update contract verification logic to check for stricter constraints (e.g., CHECK expressions, column defaults, primary keys, unique constraints).
3. Update or add tests that demonstrate both the broken and fixed behaviors.
4. Modify the main credential/authentication module to enforce the stricter contract at startup.
5. Verify changes against a real or test database, ensuring startup fails closed on contract violations.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/credentials/store.rs, src/credentials/db_tests.rs, src/credentials/mod.rs

