# AEON IQ Temp Workflow Database Migration Workflow

## Action

Follow the database-migration-workflow workflow:
1. Create or update forward migration SQL file in migrations/
2. Create or update rollback migration SQL file in rollback/
3. Update application logic to use new schema (e.g., src/tenancy.rs, src/main.rs)
4. Document migration steps and environment variables in docs/ and .env.example
5. Update CI workflow to accommodate schema changes if necessary

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: migrations/*.sql, rollback/*.sql, src/*.rs

