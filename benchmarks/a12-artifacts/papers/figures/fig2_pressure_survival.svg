<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="60" y="46" font-size="22" font-weight="700" fill="#0f172a">Under pressure, who survives?</text>
  <text x="60" y="72" font-size="14" fill="#475569">When the store is forced to shrink, which of the gold (need-again) memories are kept</text>
  <text x="60" y="104" font-size="12.5" fill="#64748b">Six gold memories enter eviction. Distractors omitted for clarity.</text>

  <rect x="60" y="120" width="310" height="250" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="215" y="150" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">AMP — evicts by learned value</text>
  <g>
    <g transform="translate(140,205)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(215,205)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(290,205)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(140,270)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(215,270)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(290,270)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <text x="215" y="340" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">~0.90 of gold kept</text>

  <rect x="390" y="120" width="310" height="250" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="545" y="150" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">LRU / random — gold-blind</text>
  <g>
    <g transform="translate(470,205)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(545,205)"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><path d="M-9 1 L-3 7 L9 -6" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(620,205)" opacity="0.32"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/></g>
    <g transform="translate(620,205)" stroke="#dc2626" stroke-width="3" stroke-linecap="round"><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="11" y1="-11" x2="-11" y2="11"/></g>
    <g transform="translate(470,270)" opacity="0.32"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/></g>
    <g transform="translate(470,270)" stroke="#dc2626" stroke-width="3" stroke-linecap="round"><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="11" y1="-11" x2="-11" y2="11"/></g>
    <g transform="translate(545,270)" opacity="0.32"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/></g>
    <g transform="translate(545,270)" stroke="#dc2626" stroke-width="3" stroke-linecap="round"><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="11" y1="-11" x2="-11" y2="11"/></g>
    <g transform="translate(620,270)" opacity="0.32"><circle r="24" fill="#f59e0b" stroke="#b45309" stroke-width="2"/></g>
    <g transform="translate(620,270)" stroke="#dc2626" stroke-width="3" stroke-linecap="round"><line x1="-11" y1="-11" x2="11" y2="11"/><line x1="11" y1="-11" x2="-11" y2="11"/></g>
  </g>
  <text x="545" y="340" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">~0.33 of gold kept</text>

  <g font-size="12.5" fill="#475569">
    <circle cx="72" cy="405" r="11" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <text x="90" y="409">gold memory kept</text>
    <g opacity="0.32"><circle cx="254" cy="405" r="11" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/></g>
    <g transform="translate(254,405)" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="6" y1="-6" x2="-6" y2="6"/></g>
    <text x="272" y="409">gold memory evicted (lost)</text>
  </g>
  <text x="60" y="450" font-size="11" fill="#94a3b8">Both policies evict the same number of memories; only AMP spares the high-value set. Source: RESULTS §8.1.</text>
