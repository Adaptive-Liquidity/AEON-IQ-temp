[package]
name = "memoryos-kernel"
version = "1.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "memoryos"
path = "src/main.rs"

[dependencies]
# Web framework
axum            = { version = "0.7", features = ["macros"] }
tokio           = { version = "1",   features = ["full"] }
tokio-stream    = "0.1"

# Serialization
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"

# Database
sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
pgvector = { version = "0.4", features = ["sqlx"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# IDs and time
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# Command-line interface
# `default-features = false` drops the colour/suggestion machinery (anstream,
# anstyle, strsim) that a non-interactive operator command has no use for, and
# keeps the dependency surface cargo-deny has to clear as small as the feature
# set allows.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# Error handling
anyhow    = "1"
thiserror = "1"

# Observability
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
# `default-features = false` drops prometheus's optional `protobuf` feature, which
# pulls in protobuf 2.28.0 (RUSTSEC-2024-0437: stack overflow on untrusted input).
# Only the text exposition format is used (see src/metrics.rs: TextEncoder), so the
# protobuf encoder was never reachable in the first place.
prometheus          = { version = "0.13", default-features = false, features = ["process"] }
once_cell           = "1"

# Middleware
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async utilities
futures = "0.3"
bytes   = "1"

# Config
dotenvy = "0.15"
dashmap  = "6"

# RMK ε-greedy exploration
rand = "0.8"

# Constant-time comparisons (prevent timing side-channels in auth)
subtle = "2"

# SHA-256 for query hashing in retrieval logs
sha2 = "0.10"
# HMAC-SHA-256 for credential verification.  A keyed MAC, not a password hash:
# credential secrets are 32 bytes of CSPRNG output, so a slow KDF would buy no
# resistance and would hand unauthenticated callers a per-request amplifier.
# See src/credentials/secret.rs.
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex  = "0.4"

[dev-dependencies]
# No extra crates needed: sqlx's #[sqlx::test] is enabled by the `migrate`
# feature already declared in [dependencies], and tokio is already full-featured.

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
