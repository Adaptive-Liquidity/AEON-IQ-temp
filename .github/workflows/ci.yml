name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Lint + unit tests (no DB required) ──────────────────────────────────────
  check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Cargo check
        run: cargo check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Unit tests (skip DB integration)
        run: cargo test -- --skip memory::store::tests --skip rmk_worker::tests --skip archival::tests::persist_archival --skip tenancy::db_tests --skip credentials::db_tests --skip credentials::grants::db_tests --skip tenancy::audit_db_tests --skip tenancy::tranche1_db_tests --skip tenancy::backfill_db_tests

  # ── Full integration tests (pgvector Postgres required) ─────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-integration-

      - name: Full test suite (includes sqlx::test)
        run: cargo test

  # ── Dashboard lint + build ───────────────────────────────────────────────────
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8080
          AUTH_SECRET: ci-placeholder-secret-32-chars-min
          NEXTAUTH_URL: http://localhost:3000
          DASHBOARD_ADMIN_EMAIL: admin@memoryos.dev
          DASHBOARD_ADMIN_PASSWORD: changeme
          MANAGEMENT_API_KEY: ""

      # Blocking gate, scoped to what actually ships. `--omit=dev` audits the
      # production dependency tree — the code that ends up in the standalone
      # build and the runtime image.
      - name: Audit high and critical vulnerabilities (production dependencies)
        run: npm audit --audit-level=high --omit=dev

      # Visibility, not a gate. The full tree currently carries high-severity
      # advisories that have no upstream fix, so gating on it would keep this
      # job permanently red or invite `npm audit fix --force`, which resolves
      # them by downgrading Next.js 15 -> 14 (semver-major) and would regress
      # the dashboard.
      #
      # All of them reduce to one advisory: brace-expansion "DoS via unbounded
      # expansion length" (GHSA, range <=5.0.7), fixed only in 5.0.8. The lint
      # toolchain cannot reach it — eslint-config-next's plugins
      # (eslint-plugin-import / jsx-a11y / react) require minimatch@^3, which
      # requires brace-expansion@^1, and no 1.x release is outside the advisory
      # range. Verified that eslint 9 does not help: its tree still resolves
      # minimatch@3.1.5 through those same plugins. Forcing brace-expansion@5
      # via an override is not viable either -- v5's CommonJS entry point
      # exports an object ({EXPANSION_MAX, EXPANSION_MAX_LENGTH, expand}) where
      # v1 exported the function itself, so minimatch@3 would throw at runtime.
      #
      # None of it ships: eslint and its plugins are devDependencies, absent
      # from the production tree above (which reports 0 vulnerabilities) and
      # from the runtime image. The exposure would be a developer or CI machine
      # feeding hostile glob patterns to its own linter.
      #
      # Revisit when eslint-config-next moves its plugins to minimatch >=9, at
      # which point this step should become blocking again and replace the one
      # above.
      # `continue-on-error` rather than `|| true`: the step is allowed to fail
      # without failing the job, but it still renders as failed, so the
      # findings stay visible in the run summary instead of behind a green tick.
      - name: Audit full dependency tree (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  # ── Docker image builds (verify Dockerfiles compile) ───────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Dependency policy: advisories, licences, bans, sources ──────────────────
  deny-check:
    name: cargo-deny
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.19.9
      CARGO_DENY_SHA256: f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af
    steps:
      - uses: actions/checkout@v4

      # cargo-deny shells out to `cargo metadata`, so pin the toolchain rather
      # than relying on whatever the runner image happens to ship.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo-deny is installed from a pinned release whose SHA-256 is recorded
      # here rather than fetched alongside the artefact. A re-published tag or a
      # tampered download therefore fails closed instead of being trusted on
      # sight. Bumping the version means bumping the digest in the same commit.
      - name: Install cargo-deny (pinned)
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf cargo-deny.tar.gz "${archive}/cargo-deny"
          sudo install -m 0755 "${archive}/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version

      # `check all` runs advisories, bans, licenses and sources. deny.toml
      # carries no advisory ignores: a new RUSTSEC advisory is expected to fail
      # this job and be fixed, not waived.
      #
      # Verified locally against this exact cargo-deny version that the gate
      # fails closed -- an advisory violation exits 1 and a licence violation
      # exits 4, so a policy breach cannot pass as a green job.
      - name: cargo deny check all
        run: cargo-deny check all
